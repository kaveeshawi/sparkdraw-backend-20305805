name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: GH_TOKEN
          # Do NOT use script_stop — it breaks if/else (false tests become exit 1)
          command_timeout: 30m
          script: |
            set -e
            APP_DIR=/var/www/sparkdraw-backend
            REPO_SLUG=kaveeshawi/sparkdraw-backend-20305805.git
            AUTH_REPO="https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}"

            if [ -z "$GH_TOKEN" ]; then
              echo "GH_TOKEN is empty — cannot clone private repo"
              exit 1
            fi

            # Laravel 13 + current lockfile need PHP 8.4+
            ensure_php84() {
              if command -v php8.4 >/dev/null 2>&1; then
                return 0
              fi
              echo "Installing PHP 8.4 (server had $(php -v | head -1 || true))"
              sudo apt-get update -y
              sudo apt-get install -y software-properties-common
              sudo add-apt-repository -y ppa:ondrej/php
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                php8.4-cli php8.4-fpm php8.4-mysql php8.4-xml php8.4-mbstring \
                php8.4-curl php8.4-zip php8.4-bcmath php8.4-tokenizer php8.4-sqlite3
            }
            ensure_php84
            PHP_BIN="$(command -v php8.4)"
            echo "Using $($PHP_BIN -v | head -1)"

            ensure_composer() {
              if command -v composer >/dev/null 2>&1; then
                return 0
              fi
              echo "Composer not found — installing..."
              curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
              $PHP_BIN /tmp/composer-setup.php --install-dir=/tmp --filename=composer
              sudo mv /tmp/composer /usr/local/bin/composer
              sudo chmod +x /usr/local/bin/composer
              rm -f /tmp/composer-setup.php
            }
            ensure_composer
            COMPOSER_BIN="$(command -v composer)"
            echo "Using composer at $COMPOSER_BIN ($($COMPOSER_BIN --version 2>/dev/null | head -1))"

            sudo mkdir -p /var/www
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf "$APP_DIR"
              sudo git clone "$AUTH_REPO" "$APP_DIR"
            fi

            # Avoid "dubious ownership" when repo was cloned as root
            sudo git config --system --add safe.directory "$APP_DIR" || true
            git config --global --add safe.directory "$APP_DIR" || true
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"
            git remote set-url origin "$AUTH_REPO"
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin "https://github.com/${REPO_SLUG}"
            echo "Code at $(git rev-parse --short HEAD)"

            NEED_APP_KEY=0
            if [ ! -f .env ]; then
              echo "No .env found — seeding from .env.example (configure DB secrets on the server)"
              cp .env.example .env
              NEED_APP_KEY=1
            else
              echo ".env already present"
            fi

            echo "Running composer install..."
            $PHP_BIN "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            if [ "$NEED_APP_KEY" = "1" ] || ! grep -q '^APP_KEY=base64:' .env; then
              echo "Generating APP_KEY..."
              $PHP_BIN artisan key:generate --force
            fi

            echo "Running migrations..."
            $PHP_BIN artisan migrate --force
            echo "Caching config/routes..."
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache

            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            # Point nginx/php-fpm at 8.4 when available
            if systemctl list-unit-files | grep -q php8.4-fpm; then
              sudo systemctl enable --now php8.4-fpm
              sudo systemctl reload php8.4-fpm
            fi
            sudo systemctl reload php8.2-fpm 2>/dev/null || true
            sudo systemctl reload php8.3-fpm 2>/dev/null || true
            echo "Deploy finished OK"
